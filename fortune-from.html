<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fortune From | Fortune From, Fortune Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f7f0df;
      --paper: #fffaf0;
      --brown: #493426;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--brown);
      font-family: "Courier Prime", "Courier New", monospace;
    }

    .page {
      width: min(700px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 12px 20px 16px;
      display: flex;
      flex-direction: column;
    }

    .back-link {
      display: inline-block;
      width: fit-content;
      color: var(--brown);
      text-decoration: none;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--brown);
      text-align: center;
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 5px;
    }

    .intro {
      text-align: center;
      line-height: 1.35;
      font-size: 0.95rem;
      margin: 0 0 14px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 5px;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--brown);
      border-radius: 12px;
      background: var(--paper);
      color: var(--brown);
      font: inherit;
      font-size: 1rem;
    }

    textarea {
      height: 115px;
      min-height: 90px;
      resize: vertical;
      line-height: 1.4;
    }

    .prompt-button,
    .continue-button {
      padding: 11px 14px;
      border: 2px solid var(--brown);
      border-radius: 14px;
      background: var(--paper);
      color: var(--brown);
      box-shadow: 3px 4px 0 var(--brown);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .prompt-button {
      align-self: flex-start;
      margin: 9px 0 5px;
    }

    .prompt-button:hover {
      background: #eee2c9;
    }

    .prompt-hint {
      font-size: 0.9rem;
      line-height: 1.3;
      margin: 3px 0 8px;
      padding: 7px 10px;
      background: #eee2c9;
      border-radius: 8px;
    }

    .signature-area {
      margin: 5px 0 12px;
      padding: 10px 13px;
      border: 2px solid var(--brown);
      border-radius: 14px;
      background: var(--paper);
    }

    .signature-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
    }

    .signature-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--brown);
    }

    .signature-toggle label {
      margin: 0;
    }

    #signatureInput {
      margin-top: 9px;
    }

    .continue-button {
      display: block;
      width: 100%;
      padding: 13px;
      background: var(--brown);
      color: white;
      font-size: 1rem;
    }

    .continue-button:hover {
      background: #654b39;
    }

    .message {
      min-height: 18px;
      margin: 8px 0 0;
      text-align: center;
      font-size: 0.9rem;
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--brown);
      outline-offset: 3px;
    }

    @media (max-width: 540px) {
      .page {
        padding: 9px 15px 12px;
      }

      h1 {
        font-size: 2rem;
      }

      .intro {
        font-size: 0.85rem;
        margin-bottom: 11px;
      }

      textarea {
        height: 105px;
        min-height: 85px;
      }

      .prompt-button {
        font-size: 0.9rem;
      }

      .signature-area {
        padding: 8px 11px;
      }

      .continue-button {
        padding: 12px;
      }
    }

    @media (max-height: 650px) {
      .page {
        padding-top: 6px;
        padding-bottom: 8px;
      }

      .back-link {
        margin-bottom: 5px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .intro {
        margin-bottom: 8px;
      }

      textarea {
        height: 85px;
        min-height: 75px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <a class="back-link" href="index.html">← Home</a>

    <h1>Fortune From</h1>

    <p class="intro">
      Welcome to the Fortune Factory. Here, you will write a fortune for somebody to find. Remember, you are now part of their day's narrative! Write something you would like to receive.
    </p>

    <label for="fortune">Write a fortune</label>

    <textarea
      id="fortune"
      maxlength="500"
      placeholder="Dear Stranger..."
    ></textarea>

    <button
      class="prompt-button"
      type="button"
      onclick="showPrompt()"
    >
      ✦ Give me a writing prompt
    </button>

    <p class="prompt-hint" id="promptHint" hidden aria-live="polite"></p>

    <section class="signature-area">

      <div class="signature-toggle">
        <input
          type="checkbox"
          id="showSignature"
          onchange="toggleSignature()"
        >
        <label for="showSignature">Show my signature</label>

    </section>

    <button
      class="continue-button"
      type="button"
      onclick="continueWriting()"
    >
      Decorate →
    </button>

    <p class="message" id="message" aria-live="polite"></p>

  </main>

  <script>
    const prompts = [
      "What is something someone might need to hear today?",
      "Write a wish for a stranger you will never meet.",
      "What makes an ordinary day special? Remind the recipient that it's in the little things.",
      "Imagine a fortune someone might find years from now.",
      "What advice would you give your younger self? Alternatively, what advice would you give your future self?",
      "Write a prediction that might make someone smile.",
      "What is something beautiful that people often overlook?",
      "Write a tiny piece of wisdom here.",
      "Write something completely unexpected like, 'You've found a 4-leaf clover!'",
      "Write a cute memory or story you have.",
      "Test your comedy here. Maybe the recipient needs some comedic relief today?",
      "Introduce some mysterious wonder to somebody's day with a cryptic message.",
      "Got poetry? Share it.",
      "Make a haiku! It's only 3 lines and 17 syllables in a 5-7-5 fashion.",
      "Sing a song lyric you love!",
      "A question to think about..."
    ];

    function showPrompt() {
      const prompt = prompts[
        Math.floor(Math.random() * prompts.length)
      ];

      const hint = document.getElementById("promptHint");

      hint.textContent = prompt;
      hint.hidden = false;
    }

    function toggleSignature() {
      const checked =
        document.getElementById("showSignature").checked;

      document.getElementById("signatureInput").hidden = !checked;
    }

    function continueWriting() {
      const fortune =
        document.getElementById("fortune").value.trim();

      const showSignature =
        document.getElementById("showSignature").checked;

      const penName =
        document.getElementById("penName").value.trim();

      const message =
        document.getElementById("message");

      if (!fortune) {
        message.textContent =
          "Your fortune is waiting to be written.";
        return;
      }

      if (showSignature && !penName) {
        message.textContent =
          "Please enter your pen name, or turn off your signature.";
        return;
      }

      message.textContent =
        "Lovely! Your fortune is ready for the next design step.";
    }
  </script>
</body>
</html>
