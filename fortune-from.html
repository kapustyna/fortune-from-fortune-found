<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fortune From | Fortune From, Fortune Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f7f0df;
      --paper: #fffaf0;
      --brown: #493426;
      --tan: #eee2c9;
      --progress-fill: #A08068;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--brown);
      font-family: "Courier Prime", "Courier New", monospace;
    }

    .page {
      width: min(700px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 12px 20px 16px;
      display: flex;
      flex-direction: column;
    }

    .back-link {
      display: inline-block;
      width: fit-content;
      color: var(--brown);
      text-decoration: none;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--brown);
      text-align: center;
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 5px;
    }

    .intro {
      text-align: center;
      line-height: 1.35;
      font-size: 0.95rem;
      margin: 0 0 14px;
    }

    /* SIX-BOX PROGRESS METER */

    .progress-meter {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 370px;
      margin: 10px auto 22px;
    }

    .progress-box {
      flex: 1;
      aspect-ratio: 1 / 1;
      max-width: 45px;
      background-color: var(--tan);
      border: 2px solid var(--brown);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brown);
      font-size: 18px;
      font-weight: bold;
    }

    .progress-box.active {
      background-color: var(--progress-fill);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 5px;
    }

    textarea {
      width: 100%;
      height: 115px;
      min-height: 90px;
      padding: 10px;
      border: 2px solid var(--brown);
      border-radius: 12px;
      background: var(--paper);
      color: var(--brown);
      font: inherit;
      font-size: 1rem;
      line-height: 1.4;
      resize: vertical;
    }

    textarea::placeholder {
      color: #87947a;
      opacity: 1;
    }

    /* BUTTON STYLING */

  .prompt-button,
.continue-button {
  padding: 11px 14px;
  border: 2px solid var(--brown);
  border-radius: 14px;
  color: var(--brown);
  box-shadow: 4px 5px 0 var(--brown);
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  transition: transform 120ms ease,
              box-shadow 120ms ease;
}

.prompt-button {
  background: var(--tan);
}

.continue-button {
  background: var(--progress-fill);
}

    .prompt-button:hover,
    .continue-button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 7px 0 var(--brown);
    }

    .prompt-button:active,
    .continue-button:active {
      transform: translate(4px, 5px);
      box-shadow: 0 0 0 var(--brown);
    }

    .prompt-button:focus:not(:focus-visible),
    .continue-button:focus:not(:focus-visible) {
      outline: none;
    }

    .prompt-button:focus-visible,
    .continue-button:focus-visible {
      outline: 3px solid var(--brown);
      outline-offset: 4px;
    }

    .prompt-button {
      align-self: flex-start;
      margin: 9px 0 12px;
    }

    .signature-area {
      margin: 5px 0 12px;
      padding: 10px 13px;
      border: 2px solid var(--brown);
      border-radius: 14px;
      background: var(--paper);
    }

    .signature-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
    }

    .signature-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--brown);
    }

    .signature-toggle label {
      margin: 0;
    }

    .continue-button {
      display: block;
      width: 100%;
      padding: 13px;
    }

    .message {
      min-height: 18px;
      margin: 8px 0 0;
      text-align: center;
      font-size: 0.9rem;
    }

    textarea:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--brown);
      outline-offset: 3px;
    }

    @media (max-width: 540px) {
      .page {
        padding: 9px 15px 12px;
      }

      h1 {
        font-size: 2rem;
      }

      .intro {
        font-size: 0.85rem;
        margin-bottom: 11px;
      }

      .progress-meter {
        gap: 7px;
        max-width: 330px;
      }

      .progress-box {
        max-width: 42px;
        font-size: 17px;
      }

      textarea {
        height: 105px;
        min-height: 85px;
      }

      .prompt-button {
        font-size: 0.9rem;
      }

      .signature-area {
        padding: 8px 11px;
      }

      .continue-button {
        padding: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .prompt-button,
      .continue-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <a class="back-link" href="index.html">← Home</a>

    <h1>Fortune From</h1>

    <p class="intro">
      Welcome to the Fortune Factory! Create a fortune for someone to find. Remember, you’ll become part of someone’s day, so choose to brighten it!
    </p>

    <!-- PROGRESS METER -->
    <div class="progress-meter" id="progressMeter"
         aria-label="Fortune creation progress">

      <div class="progress-box active">1</div>
      <div class="progress-box">2</div>
      <div class="progress-box">3</div>
      <div class="progress-box">4</div>
      <div class="progress-box">5</div>
      <div class="progress-box">6</div>

    </div>

    <label for="fortune">Write a fortune</label>

    <textarea
      id="fortune"
      maxlength="500"
      placeholder="Dear Stranger..."
    ></textarea>

    <button
      type="button"
      class="prompt-button"
      onclick="generatePrompt()"
    >
      ✦ Give me a prompt
    </button>

    <section class="signature-area">
      <div class="signature-toggle">
        <input type="checkbox" id="showSignature">
        <label for="showSignature">Show my signature</label>
      </div>
    </section>

    <button
      class="continue-button"
      type="button"
      onclick="continueWriting()"
    >
      Decorate →
    </button>

    <p class="message" id="message" aria-live="polite"></p>

  </main>

  <script>
    // WRITING PROMPTS

    const prompts = [
      "What is something someone might need to hear today?",
      "Poof! You're now a wizard. Wish something good into their day.",
      "What makes an ordinary day special? Remind the recipient that it's in the little things.",
      "Imagine a fortune someone might find years from now.",
      "What advice would you give your younger self? Alternatively, what advice would you give your future self?",
      "Write a prediction that might make someone smile.",
      "What is something beautiful that people often overlook?",
      "Write a tiny piece of wisdom here.",
      "Write something completely unexpected like, 'You've found a 4-leaf clover!'",
      "Write a cute memory or story you have.",
      "Test your comedy here. Maybe the recipient needs some comedic relief today?",
      "Introduce some mysterious wonder to somebody's day with a cryptic message.",
      "Got poetry? Share it.",
      "Make a haiku! It's only 3 lines and 17 syllables in a 5-7-5 fashion.",
      "Sing a song lyric you love!",
      "A question to think about..."
    ];

    // GENERATE A PROMPT ONLY WHEN THE BOX IS EMPTY

    function generatePrompt() {
      const textBox = document.getElementById("fortune");
      const message = document.getElementById("message");

      // Do not generate a prompt if the user has started writing.
      if (textBox.value.trim() !== "") {
        message.textContent =
          "You've already started writing! Keep going with your fortune.";
        return;
      }

      // Choose a random prompt.
      const randomPrompt =
        prompts[Math.floor(Math.random() * prompts.length)];

      // Change only the placeholder.
      // Do not focus the textarea or open the keyboard.
      textBox.placeholder = randomPrompt;

      message.textContent = "";
    }

    // PROGRESS METER

    function updateProgress(step) {
      const boxes = document.querySelectorAll(".progress-box");

      boxes.forEach((box, index) => {
        box.classList.toggle("active", index < step);
      });
    }

    // This page is step 1.
    updateProgress(1);

    // CONTINUE BUTTON

    function continueWriting() {
      const fortune =
        document.getElementById("fortune").value.trim();

      const message =
        document.getElementById("message");

      if (!fortune) {
        message.textContent =
          "Your fortune is waiting to be written.";
        return;
      }

      // Keep the fortune for the next page.
      sessionStorage.setItem("fortuneText", fortune);

      // Keep the signature choice for the next page.
      sessionStorage.setItem(
        "showSignature",
        document.getElementById("showSignature").checked
      );

            // Keep the signature choice for the next page.
      sessionStorage.setItem(
        "showSignature",
        document.getElementById("showSignature").checked
      );

      // Move to the paper selection page.
      window.location.href = "decorate-paper.html";

    }
  </script>
</body>
</html>
