<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fortune From, Fortune Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f7f0df;
      --paper: #fffaf0;
      --brown: #493426;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--brown);
      font-family: "Courier Prime", "Courier New", monospace;
    }

    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 5rem);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -2px;
    }

    h1 span {
      display: block;
      color: var(--brown);
      font-style: normal;
    }

    .tagline {
      margin: 24px 0 48px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 24px;
      width: 100%;
      max-width: 650px;
    }


.main-button {
  flex: 1;
  min-height: 115px;
  padding: 22px 18px;

  background-color: #eee2c9;
  color: #493426;

  border: 3px solid #493426;
  border-radius: 22px 18px 24px 17px;

  box-shadow: 6px 7px 0 #493426;

  font-family: inherit;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  font-weight: 700;

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;

  transition:
    transform 120ms ease,
    box-shadow 120ms ease,
    background-color 120ms ease;
}

.main-button:hover {
  background-color: #eee2c9;
  transform: translate(-2px, -2px);
  box-shadow: 8px 9px 0 #493426;
}

.main-button:active {
  background-color: #eee3c9;
  transform: translate(5px, 6px);
  box-shadow: 1px 1px 0 #493426;
}

.main-button:focus {
  outline: none;
}

.main-button:focus-visible {
  outline: 3px solid #b96f55;
  outline-offset: 5px;
}

@media (prefers-reduced-motion: reduce) {
  .main-button {
    transition: none;
  }
}


    .button-icon {
      display: block;
      margin-bottom: 10px;
      font-size: 1.8rem;
      line-height: 1;
    }

    .notice {
      min-height: 30px;
      margin-top: 38px;
      font-size: 1rem;
    }

    @media (max-width: 540px) {
      .buttons {
        flex-direction: column;
        max-width: 330px;
        gap: 20px;
      }

      .main-button {
        min-height: 100px;
      }

      .tagline {
        margin-bottom: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .main-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="home">
    <h1>
      Fortune From,
      <span>Fortune Found</span>
    </h1>

    <p class="tagline">
      The little daily fortune box - give one, take one. 
    </p>

    <div class="buttons">
      <button class="main-button" onclick="window.location.href='fortune-from.html'">
        <span class="button-icon" aria-hidden="true">✉</span>
        Fortune From
      </button>

      <button class="main-button" onclick="showNotice('Fortune Found is coming soon!')">
        <span class="button-icon" aria-hidden="true">✦</span>
        Fortune Found
      </button>
    </div>

    <p class="notice" id="notice" aria-live="polite"></p>
  </main>

  <script>
    function showNotice(message) {
      document.getElementById("notice").textContent = message;
    }
  </script>
</body>
</html>
