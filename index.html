
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortune From, Fortune Found</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f4ebdd;color:#604832;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:620px;text-align:center}
h1{font-size:clamp(34px,7vw,52px);font-weight:normal;line-height:1.2;margin:0 0 48px;color:#604832}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a{color:#76563d;text-decoration:none}
.action{background:#e4d0b8;border-radius:12px;min-height:155px;padding:25px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:background .2s}
.action:hover{background:#d9c1a5}
.icon{font-family:Arial,sans-serif;font-size:27px;color:#76563d}
.action strong{font-family:Arial,sans-serif;font-size:14px;letter-spacing:1px;color:#76563d}
.action span:last-child{font-size:14px;color:#76563d}
.signature{display:inline-block;margin-top:24px;padding:16px 25px;background:#b99a78;color:#fff!important;border-radius:10px;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;letter-spacing:1px;transition:background .2s}
.signature:hover{background:#a98a68}
.tagline{font-size:14px;color:#806a55;margin-top:42px}
@media(max-width:420px){
.actions{gap:10px}
.action{min-height:145px;padding:18px 8px}
.action strong{font-size:12px}
.action span:last-child{font-size:12px}
}
</style>
</head>
<body>
<main>
<h1>Welcome to<br>Fortune From,<br>Fortune Found</h1>
<div class="actions">
<a href="#" class="action">
<span class="icon">✉</span>
<strong>FORTUNE FROM</strong>
<span>Write a letter for somebody</span>
</a>
<a href="#" class="action">
<span class="icon">✧</span>
<strong>FORTUNE FOUND</strong>
<span>Open your fortune</span>
</a>
</div>
<a href="#" class="signature">CREATE A SIGNATURE</a>
<p class="tagline">Little fortunes, left by someone, found by you.</p>
</main>
</body>
</html>
