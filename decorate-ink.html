
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Lato:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f7f0df;
      --paper: #fffaf0;
      --brown: #493426;
      --tan: #eee2c9;
      --progress-fill: #A08068;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--brown);
      font-family: "Courier Prime", "Courier New", monospace;
    }

    .page {
      width: min(700px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 12px 20px 16px;
      display: flex;
      flex-direction: column;
    }

    .back-link {
      display: inline-block;
      width: fit-content;
      color: var(--brown);
      text-decoration: none;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--brown);
      text-align: center;
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 5px;
    }

    .intro {
      text-align: center;
      line-height: 1.35;
      font-size: 0.95rem;
      margin: 0 0 14px;
    }

    /* SIX-BOX PROGRESS METER */

    .progress-meter {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 370px;
      margin: 10px auto 22px;
    }

    .progress-box {
      flex: 1;
      aspect-ratio: 1 / 1;
      max-width: 45px;
      background-color: var(--tan);
      border: 2px solid var(--brown);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brown);
      font-size: 18px;
      font-weight: bold;
    }

    .progress-box.active {
      background-color: var(--progress-fill);
    }

    /* SECTION HEADINGS */

    .section-label {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .ink-section {
      margin-bottom: 24px;
    }

    /* INK BLOTCHES */

    .ink-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      justify-items: center;
      gap: 16px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .ink-option {
      position: relative;
      width: 76px;
      height: 76px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .ink-blotch {
      display: block;
      width: 58px;
      height: 58px;
      border-radius: 57% 43% 48% 52% / 43% 53% 47% 57%;
      background: var(--ink-color);
      border: 1px solid rgba(73, 52, 38, 0.2);
      transform: rotate(-8deg);
    }

    .ink-option:nth-child(2) .ink-blotch {
      border-radius: 44% 56% 54% 46% / 52% 42% 58% 48%;
      transform: rotate(12deg);
    }

    .ink-option:nth-child(3) .ink-blotch {
      border-radius: 52% 48% 42% 58% / 47% 58% 42% 53%;
      transform: rotate(-15deg);
    }

    .ink-option:nth-child(4) .ink-blotch {
      border-radius: 46% 54% 59% 41% / 55% 45% 55% 45%;
      transform: rotate(10deg);
    }

    .ink-option:nth-child(5) .ink-blotch {
      border-radius: 58% 42% 45% 55% / 42% 57% 43% 58%;
      transform: rotate(-5deg);
    }

    .ink-option:nth-child(6) .ink-blotch {
      border-radius: 48% 52% 57% 43% / 56% 44% 56% 44%;
      transform: rotate(14deg);
    }

    .ink-option.selected {
      border-color: var(--brown);
      box-shadow: 0 0 0 3px var(--progress-fill);
    }

    .ink-option.selected::after {
      content: "✓";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 23px;
      height: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--brown);
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .ink-option:focus-visible,
    .font-option:focus-visible {
      outline: 3px solid var(--brown);
      outline-offset: 5px;
    }

    /* FONT CHOICES */

    .font-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .font-option {
      position: relative;
      min-height: 75px;
      padding: 12px 5px;
      border: 2px solid var(--brown);
      border-radius: 10px;
      background: var(--tan);
      color: var(--brown);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .font-option.selected {
      outline: 3px solid var(--progress-fill);
      outline-offset: 2px;
    }

    .font-option.selected::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 7px;
      font-family: "Courier Prime", monospace;
      font-size: 15px;
      font-weight: bold;
    }

    .font-sample {
      font-size: 1rem;
    }

    .typewriter-sample {
      font-family: "Courier Prime", monospace;
    }

    .plain-sample {
      font-family: "Lato", sans-serif;
      font-weight: 700;
    }

    .handwritten-sample {
      font-family: "Caveat", cursive;
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* PREVIEW */

    .preview-area {
      margin: 0 0 20px;
    }

    .preview-paper {
      width: 100%;
      min-height: 125px;
      padding: 20px;
      border: 2px solid rgba(73, 52, 38, 0.35);
      border-radius: 5px;
      background-color: var(--paper);
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(73, 52, 38, 0.035) 0px,
          rgba(73, 52, 38, 0.035) 1px,
          transparent 1px,
          transparent 4px
        );
      box-shadow: 3px 4px 7px rgba(73, 52, 38, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #previewText {
      margin: 0;
      color: #292521;
      font-family: "Courier Prime", monospace;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* CONTINUE BUTTON */

    .continue-button {
      display: block;
      width: 100%;
      padding: 13px;
      border: 2px solid var(--brown);
      border-radius: 14px;
      background: var(--progress-fill);
      color: var(--brown);
      box-shadow: 4px 5px 0 var(--brown);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      transition: transform 120ms ease,
                  box-shadow 120ms ease;
    }

    .continue-button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 7px 0 var(--brown);
    }

    .continue-button:active {
      transform: translate(4px, 5px);
      box-shadow: 0 0 0 var(--brown);
    }

    .continue-button:focus-visible {
      outline: 3px solid var(--brown);
      outline-offset: 4px;
    }

    .message {
      min-height: 18px;
      margin: 8px 0 0;
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 540px) {
      .page {
        padding: 9px 15px 12px;
      }

      h1 {
        font-size: 2rem;
      }

      .intro {
        font-size: 0.85rem;
        margin-bottom: 11px;
      }

      .progress-meter {
        gap: 7px;
        max-width: 330px;
      }

      .progress-box {
        max-width: 42px;
        font-size: 17px;
      }

      .ink-grid {
        gap: 10px;
      }

      .ink-option {
        width: 70px;
        height: 70px;
      }

      .ink-blotch {
        width: 53px;
        height: 53px;
      }

      .font-grid {
        gap: 7px;
      }

      .font-option {
        min-height: 70px;
        padding: 10px 3px;
      }

      .font-sample {
        font-size: 0.9rem;
      }

      .handwritten-sample {
        font-size: 1.35rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .continue-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <a class="back-link" href="decorate-paper.html">← Back</a>

    <h1>Fortune From</h1>

    <p class="intro">
      Welcome to the Fortune Factory! Create a fortune for someone to find. Remember: You'll become part of someone's day, so choose to brighten it!
    </p>

    <!-- PROGRESS METER -->

    <div class="progress-meter" id="progressMeter"
         aria-label="Fortune creation progress">

      <div class="progress-box active">1</div>
      <div class="progress-box active">2</div>
      <div class="progress-box active">3</div>
      <div class="progress-box">4</div>
      <div class="progress-box">5</div>
      <div class="progress-box">6</div>

    </div>

    <!-- INK SELECTION -->

    <section class="ink-section">

      <label class="section-label">Choose an ink</label>

      <div class="ink-grid">

        <button type="button"
                class="ink-option"
                style="--ink-color: #292521"
                aria-label="Black ink"
                aria-pressed="false"
                onclick="selectInk('Black', '#292521', this)">
          <span class="ink-blotch"></span>
        </button>

        <button type="button"
                class="ink-option"
                style="--ink-color: #315c91"
                aria-label="Blue ink"
                aria-pressed="false"
                onclick="selectInk('Blue', '#315c91', this)">
          <span class="ink-blotch"></span>
        </button>

        <button type="button"
                class="ink-option"
                style="--ink-color: #b94743"
                aria-label="Red ink"
                aria-pressed="false"
                onclick="selectInk('Red', '#b94743', this)">
          <span class="ink-blotch"></span>
        </button>

        <button type="button"
                class="ink-option"
                style="--ink-color: #476b4f"
                aria-label="Green ink"
                aria-pressed="false"
                onclick="selectInk('Green', '#476b4f', this)">
          <span class="ink-blotch"></span>
        </button>

        <button type="button"
                class="ink-option"
                style="--ink-color: #76516f"
                aria-label="Purple ink"
                aria-pressed="false"
                onclick="selectInk('Purple', '#76516f', this)">
          <span class="ink-blotch"></span>
        </button>

        <button type="button"
                class="ink-option"
                style="--ink-color: #fffaf0"
                aria-label="White ink"
                aria-pressed="false"
                onclick="selectInk('White', '#fffaf0', this)">
          <span class="ink-blotch"></span>
        </button>

      </div>
    </section>

    <!-- FONT SELECTION -->

    <section class="ink-section">

      <label class="section-label">Choose a font</label>

      <div class="font-grid">

        <button type="button"
                class="font-option"
                aria-pressed="false"
                onclick="selectFont('typewriter', this)">
          <span class="font-sample typewriter-sample">
            Typewriter
          </span>
        </button>

        <button type="button"
                class="font-option"
                aria-pressed="false"
                onclick="selectFont('plain', this)">
          <span class="font-sample plain-sample">
            Plain
          </span>
        </button>

        <button type="button"
                class="font-option"
                aria-pressed="false"
                onclick="selectFont('handwritten', this)">
          <span class="font-sample handwritten-sample">
            Handwritten
          </span>
        </button>

      </div>
    </section>

    <!-- PREVIEW -->

    <section class="preview-area">

      <div class="preview-paper" id="previewPaper">
        <p id="previewText">Your fortune here.</p>
      </div>

    </section>

    <button
      class="continue-button"
      type="button"
      onclick="continueInk()"
    >
      Continue →
    </button>

    <p class="message" id="message" aria-live="polite"></p>

  </main>

  <script>
    // CURRENT SELECTIONS

    let selectedInk = "";
    let selectedInkHex = "";
    let selectedFont = "";

    // PAPER COLOURS FROM STEP 2

    const paperColours = {
      Ivory: "#fffaf0",
      Butter: "#f0df9e",
      Terracotta: "#b96f55",
      Blush: "#d9a5a1",
      Lavender: "#d8cde3",
      Powder: "#c9dce8",
      Sage: "#c4cdbb",
      Smoke: "#deded9",
      Charcoal: "#a39d97"
    };

    // CHECK THAT A VALID PAPER WAS SELECTED IN STEP 2

    const savedPaper =
      sessionStorage.getItem("paperChoice");

    const paperColour = paperColours[savedPaper];

    if (!paperColour) {
      window.location.replace("decorate-paper.html");
    } else {
      const previewPaper =
        document.getElementById("previewPaper");

      previewPaper.style.backgroundColor = paperColour;
    }

    // INK SELECTION

    function selectInk(inkName, inkHex, selectedButton) {
      const options =
        document.querySelectorAll(".ink-option");

      options.forEach((option) => {
        option.classList.remove("selected");
        option.setAttribute("aria-pressed", "false");
      });

      selectedButton.classList.add("selected");
      selectedButton.setAttribute("aria-pressed", "true");

      selectedInk = inkName;
      selectedInkHex = inkHex;

      updatePreview();

      document.getElementById("message").textContent = "";
    }

    // FONT SELECTION

    function selectFont(fontName, selectedButton) {
      const options =
        document.querySelectorAll(".font-option");

      options.forEach((option) => {
        option.classList.remove("selected");
        option.setAttribute("aria-pressed", "false");
      });

      selectedButton.classList.add("selected");
      selectedButton.setAttribute("aria-pressed", "true");

      selectedFont = fontName;

      updatePreview();

      document.getElementById("message").textContent = "";
    }

    // LIVE PREVIEW

    function updatePreview() {
      const preview =
        document.getElementById("previewText");

      if (selectedInkHex) {
        preview.style.color = selectedInkHex;
      }

      if (selectedFont === "typewriter") {
        preview.style.fontFamily =
          '"Courier Prime", "Courier New", monospace';
      }

      if (selectedFont === "plain") {
        preview.style.fontFamily =
          '"Lato", sans-serif';
      }

      if (selectedFont === "handwritten") {
        preview.style.fontFamily =
          '"Caveat", cursive';
      }
    }

    // CONTINUE BUTTON

    function continueInk() {
      const message =
        document.getElementById("message");

      if (!selectedInk) {
        message.textContent =
          "Please choose an ink colour.";
        return;
      }

      if (!selectedFont) {
        message.textContent =
          "Please choose a font.";
        return;
      }

      // SAVE THE INK CHOICE

      sessionStorage.setItem("inkChoice", selectedInk);
      sessionStorage.setItem("inkColour", selectedInkHex);

      // SAVE THE FONT CHOICE

      sessionStorage.setItem("fontChoice", selectedFont);

      message.textContent =
        "Lovely! Your ink and font choices are saved.";
    }
  </script>
</body>
</html>
