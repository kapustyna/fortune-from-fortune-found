
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f5f0df;
      --paper: #fffaf0;
      --blue: #344b61;
      --blue-light: #526b80;
      --blue-dark: #253747;
      --tan: #ded6c2;
      --shadow: #a9a18e;
      --progress-fill: #526b80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--cream);
      background-image:
        radial-gradient(#d6cfbb 0.7px, transparent 0.7px);
      background-size: 6px 6px;
      color: var(--blue-dark);
      font-family: "Courier Prime", "Courier New", monospace;
    }

    .page {
      width: min(700px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 35px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* MAIN COMPUTER WINDOW */

    .window {
      background: var(--cream);
      border: 3px solid var(--blue-dark);
      box-shadow:
        6px 6px 0 var(--blue-dark),
        10px 10px 0 rgba(37, 55, 71, 0.12);
    }

    /* TOP WINDOW BAR */

    .title-bar {
      min-height: 38px;
      background: var(--blue);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      border-bottom: 3px solid var(--blue-dark);
    }

    .title-bar-text {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .window-controls {
      display: flex;
      gap: 5px;
    }

    .window-control {
      width: 23px;
      height: 23px;
      background: var(--cream);
      color: var(--blue-dark);
      border: 2px solid var(--blue-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      line-height: 1;
    }

    .window-control.close {
      background: #c78f84;
    }

    /* WINDOW CONTENT */

    .window-content {
      padding: 24px 30px 28px;
    }

    .back-link {
      display: inline-block;
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    h1 {
      color: var(--blue);
      text-align: center;
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 8px;
      letter-spacing: -1px;
    }

    .intro {
      text-align: center;
      line-height: 1.5;
      font-size: 0.95rem;
      margin: 0 auto 18px;
      max-width: 520px;
    }

    /* PROGRESS METER */

    .progress-container {
      background: var(--tan);
      border: 2px solid var(--blue);
      padding: 12px;
      margin: 18px auto 24px;
      max-width: 420px;
    }

    .progress-heading {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 9px;
      color: var(--blue);
    }

    .progress-meter {
      display: flex;
      justify-content: center;
      gap: 7px;
      width: 100%;
    }

    .progress-box {
      flex: 1;
      aspect-ratio: 1 / 1;
      max-width: 42px;
      background: var(--cream);
      border: 2px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      font-size: 17px;
      font-weight: bold;
      box-shadow: 2px 2px 0 var(--shadow);
    }

    .progress-box.active {
      background: var(--blue);
      color: var(--cream);
    }

    /* SECTION LABEL */

    .section-label {
      display: block;
      font-weight: 700;
      margin: 0 auto 12px;
      max-width: 480px;
      color: var(--blue);
    }

    .section-label::before {
      content: "> ";
    }

    /* PAPER CHOICES */

    .paper-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 25px;
    }

    .paper-option {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px 13px 8px;
      border: 2px solid var(--blue);
      border-radius: 0;
      color: var(--blue-dark);
      font-family: inherit;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--blue-dark);

      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(52, 75, 97, 0.035) 0px,
          rgba(52, 75, 97, 0.035) 1px,
          transparent 1px,
          transparent 4px
        );

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;

      transition:
        transform 120ms ease,
        box-shadow 120ms ease;
    }

    /* FOLDED CORNER */

    .paper-option::before {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 22px 22px;
      border-color:
        transparent transparent var(--blue) transparent;
      z-index: 1;
    }

    .paper-option::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 16px 16px;
      border-color:
        transparent transparent var(--cream) transparent;
      z-index: 2;
    }

    .paper-option:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--blue-dark);
    }

    .paper-option.selected {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
      border-width: 3px;
      box-shadow: 4px 4px 0 var(--blue-dark);
    }

    .paper-option.selected::after {
      content: "✓";
      position: absolute;
      top: 5px;
      right: 7px;
      bottom: auto;
      width: auto;
      height: auto;
      border: none;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--blue-dark);
      z-index: 3;
    }

    .paper-option:focus-visible {
      outline: 3px dashed var(--blue-dark);
      outline-offset: 5px;
    }

    /* PAPER COLOURS */

    .ivory {
      background-color: #fffaf0;
    }

    .butter {
      background-color: #f0df9e;
    }

    .terracotta {
      background-color: #e3ae9a;
    }

    .blush {
      background-color: #ebcad9;
    }

    .lavender {
      background-color: #d8cde3;
    }

    .powder {
      background-color: #c9dce8;
    }

    .sage {
      background-color: #bcd4c1;
    }

    .smoke {
      background-color: #deded9;
    }

    .vintage {
      background-color: #e2c6a6;
    }

    /* CONTINUE BUTTON */

    .continue-button {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 14px;
      border: 2px solid var(--blue-dark);
      border-radius: 0;
      background: var(--blue);
      color: var(--cream);
      box-shadow: 4px 4px 0 var(--blue-dark);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      transition:
        transform 120ms ease,
        box-shadow 120ms ease;
    }

    .continue-button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--blue-dark);
      background: var(--blue-light);
    }

    .continue-button:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 var(--blue-dark);
    }

    .continue-button:focus-visible {
      outline: 3px dashed var(--blue-dark);
      outline-offset: 4px;
    }

    .message {
      min-height: 18px;
      margin: 12px 0 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--blue);
      font-weight: 700;
    }

    /* BOTTOM STATUS BAR */

    .status-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      background: var(--tan);
      border-top: 2px solid var(--blue);
      font-size: 0.7rem;
      color: var(--blue-dark);
    }

    /* MOBILE */

    @media (max-width: 540px) {
      .page {
        padding: 20px 13px;
      }

      .window {
        box-shadow:
          4px 4px 0 var(--blue-dark);
      }

      .window-content {
        padding: 18px 15px 22px;
      }

      h1 {
        font-size: 2rem;
      }

      .intro {
        font-size: 0.85rem;
        margin-bottom: 12px;
      }

      .progress-container {
        padding: 9px;
      }

      .progress-meter {
        gap: 6px;
      }

      .progress-box {
        max-width: 38px;
        font-size: 15px;
      }

      .paper-grid {
        gap: 11px;
      }

      .paper-option {
        padding: 5px;
        font-size: 0.85rem;
      }

      .status-bar {
        font-size: 0.6rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .paper-option,
      .continue-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="window">

      <!-- COMPUTER TITLE BAR -->
      <div class="title-bar">
        <span class="title-bar-text">
          ▣ FORTUNE_FACTORY.exe
        </span>

        <div class="window-controls" aria-label="Window controls">
          <span class="window-control" aria-hidden="true">_</span>
          <span class="window-control" aria-hidden="true">□</span>
          <span class="window-control close" aria-hidden="true">×</span>
        </div>
      </div>

      <div class="window-content">

        <a class="back-link" href="fortune-from.html">
          ← Back
        </a>

        <h1>Fortune From</h1>

        <p class="intro">
          Welcome to the Fortune Factory! Create a fortune for someone to find. Remember: You’ll become part of someone’s day, so choose to brighten it!
        </p>

        <!-- PROGRESS METER -->
        <div class="progress-container">

          <div class="progress-heading">
            <span>CREATION PROGRESS</span>
            <span>02 / 06</span>
          </div>

          <div class="progress-meter"
               id="progressMeter"
               aria-label="Fortune creation progress">

            <div class="progress-box active">1</div>
            <div class="progress-box active">2</div>
            <div class="progress-box">3</div>
            <div class="progress-box">4</div>
            <div class="progress-box">5</div>
            <div class="progress-box">6</div>

          </div>
        </div>

        <label class="section-label">
          Choose a paper
        </label>

        <!-- PAPER SAMPLE GRID -->
        <div class="paper-grid"
             aria-label="Choose your paper colour">

          <button type="button"
                  class="paper-option ivory"
                  aria-pressed="false"
                  onclick="selectPaper('Ivory', this)">
            Ivory
          </button>

          <button type="button"
                  class="paper-option butter"
                  aria-pressed="false"
                  onclick="selectPaper('Butter', this)">
            Butter
          </button>

          <button type="button"
                  class="paper-option terracotta"
                  aria-pressed="false"
                  onclick="selectPaper('Terracotta', this)">
            Terracotta
          </button>

          <button type="button"
                  class="paper-option blush"
                  aria-pressed="false"
                  onclick="selectPaper('Blush', this)">
            Blush
          </button>

          <button type="button"
                  class="paper-option lavender"
                  aria-pressed="false"
                  onclick="selectPaper('Lavender', this)">
            Lavender
          </button>

          <button type="button"
                  class="paper-option powder"
                  aria-pressed="false"
                  onclick="selectPaper('Powder', this)">
            Powder
          </button>

          <button type="button"
                  class="paper-option sage"
                  aria-pressed="false"
                  onclick="selectPaper('Sage', this)">
            Sage
          </button>

          <button type="button"
                  class="paper-option smoke"
                  aria-pressed="false"
                  onclick="selectPaper('Smoke', this)">
            Smoke
          </button>

          <button type="button"
                  class="paper-option vintage"
                  aria-pressed="false"
                  onclick="selectPaper('Vintage', this)">
            Vintage
          </button>

        </div>

        <button
          class="continue-button"
          type="button"
          onclick="continuePaper()"
        >
          CONTINUE →
        </button>

        <p class="message"
           id="message"
           aria-live="polite"></p>

      </div>

      <!-- STATUS BAR -->
      <div class="status-bar">
        <span>● SYSTEM READY</span>
        <span>FORTUNE FACTORY v1.0</span>
      </div>

    </div>

  </main>

  <script>
    // PAPER SELECTION

    let selectedPaper = "";

    function selectPaper(paperName, selectedButton) {
      const paperOptions =
        document.querySelectorAll(".paper-option");

      paperOptions.forEach((option) => {
        option.classList.remove("selected");
        option.setAttribute("aria-pressed", "false");
      });

      selectedButton.classList.add("selected");
      selectedButton.setAttribute("aria-pressed", "true");

      selectedPaper = paperName;

      document.getElementById("message").textContent =
        paperName + " paper selected.";
    }

    // CONTINUE BUTTON

    function continuePaper() {
      const message = document.getElementById("message");

      if (!selectedPaper) {
        message.textContent = "Please choose a paper.";
        return;
      }

      sessionStorage.setItem("paperChoice", selectedPaper);

      window.location.href = "decorate-ink.html";
    }
  </script>
</body>
</html>
