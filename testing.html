
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f1eee2;
      --paper: #faf7ec;
      --blue: #40586b;
      --blue-light: #647b87;
      --blue-dark: #303e48;
      --tan: #d9d7c5;
      --olive: #858b70;
      --olive-light: #b5b99c;
      --stone: #c5c5b5;
      --shadow: #303e48;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      background-image:
        radial-gradient(#c7c5b5 0.8px, transparent 0.8px);
      background-size: 7px 7px;
      color: var(--blue-dark);
      font-family: "Courier Prime", "Courier New", monospace;
    }

    button {
      font-family: inherit;
    }

    .page {
      width: min(650px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* MAIN WINDOW */

    .window {
      background: var(--cream);
      border: 2px solid var(--blue-dark);
      box-shadow: 5px 5px 0 var(--blue-dark);
      width: 100%;
      position: relative;
    }

    /* COMPUTER TITLE BAR */

    .title-bar {
      min-height: 42px;
      background: var(--blue);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
    }

    .title-bar-text {
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.4px;
    }

    .window-controls {
      display: flex;
      gap: 5px;
    }

    .window-control {
      width: 21px;
      height: 21px;
      background: var(--cream);
      color: var(--blue-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
    }

    .window-control.close {
      background: #bd8e7e;
    }

    /* PIXEL CHECKER ACCENT */

    .pixel-strip {
      height: 9px;
      background-color: var(--olive);
      background-image:
        conic-gradient(
          var(--cream) 25%,
          transparent 0 50%,
          var(--cream) 0 75%,
          transparent 0
        );
      background-size: 12px 12px;
    }

    /* WINDOW CONTENT */

    .window-content {
      padding: 25px 30px 27px;
    }

    .back-link {
      display: inline-block;
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
      margin-bottom: 17px;
      font-size: 0.85rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    h1 {
      color: var(--blue-dark);
      text-align: center;
      font-size: clamp(2rem, 7vw, 3.2rem);
      line-height: 1.05;
      margin: 0 0 12px;
      letter-spacing: -2px;
    }

    .intro {
      text-align: center;
      line-height: 1.55;
      font-size: 0.9rem;
      margin: 0 auto 23px;
      max-width: 450px;
      color: var(--blue);
    }

    /* PROGRESS METER */

    .progress-container {
      background: var(--tan);
      padding: 12px 13px;
      margin: 18px auto 28px;
      max-width: 420px;
    }

    .progress-heading {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--blue-dark);
    }

    .progress-meter {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .progress-box {
      flex: 1;
      aspect-ratio: 1.35 / 1;
      max-width: 48px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      font-size: 15px;
      font-weight: bold;
    }

    .progress-box.active {
      background: var(--olive);
      color: var(--cream);
    }

    /* SECTION LABEL */

    .section-label {
      display: block;
      font-weight: 700;
      margin: 0 auto 13px;
      max-width: 480px;
      color: var(--blue-dark);
      font-size: 0.95rem;
    }

    .section-label::before {
      content: "> ";
      color: var(--olive);
    }

    /* PAPER CHOICES */

    .paper-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 28px;
    }

    .paper-option {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      min-width: 0;
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: none;
      border-radius: 0;
      color: var(--blue-dark);
      font-family: inherit;
      font-size: clamp(0.76rem, 2.5vw, 0.95rem);
      font-weight: 700;
      cursor: pointer;

      box-shadow: 3px 3px 0 var(--blue-dark);

      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(48, 62, 72, 0.045) 0px,
          rgba(48, 62, 72, 0.045) 1px,
          transparent 1px,
          transparent 4px
        );

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;

      transition:
        transform 120ms ease,
        box-shadow 120ms ease;
    }

    /* FOLDED CORNER */

    .paper-option::before {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 20px 20px;
      border-color:
        transparent transparent var(--blue-dark) transparent;
    }

    .paper-option::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 14px 14px;
      border-color:
        transparent transparent var(--cream) transparent;
    }

    .paper-option:active {
      transform: translate(3px, 3px);
      box-shadow: none;
    }

    .paper-option:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--blue-dark);
    }

    .paper-option.selected {
      outline: 3px solid var(--olive);
      outline-offset: 3px;
      box-shadow: 4px 4px 0 var(--blue-dark);
    }

    .paper-option.selected::after {
      content: "✓";
      position: absolute;
      top: 5px;
      right: 7px;
      bottom: auto;
      width: auto;
      height: auto;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue-dark);
      z-index: 3;
    }

    .paper-option:focus-visible {
      outline: 3px dashed var(--blue-dark);
      outline-offset: 5px;
    }

    /* PAPER COLOURS */

    .ivory {
      background-color: #faf7ec;
    }

    .butter {
      background-color: #e5d9a9;
    }

    .terracotta {
      background-color: #d5aa91;
    }

    .blush {
      background-color: #d8c0b9;
    }

    .lavender {
      background-color: #c6c6c1;
    }

    .powder {
      background-color: #b9cbd0;
    }

    .sage {
      background-color: #adb69a;
    }

    .smoke {
      background-color: #c9cbbf;
    }

    .vintage {
      background-color: #cdbb9b;
    }

    /* CONTINUE BUTTON */

    .continue-button {
      display: block;
      width: 100%;
      max-width: 480px;
      min-height: 54px;
      margin: 0 auto;
      padding: 14px;
      border: none;
      border-radius: 0;
      background: var(--blue);
      color: var(--cream);
      box-shadow: 4px 4px 0 var(--blue-dark);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;

      transition:
        transform 120ms ease,
        box-shadow 120ms ease,
        background 120ms ease;
    }

    .continue-button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--blue-dark);
      background: var(--olive);
    }

    .continue-button:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    .continue-button:focus-visible {
      outline: 3px dashed var(--blue-dark);
      outline-offset: 4px;
    }

    .message {
      min-height: 18px;
      margin: 14px 0 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--olive);
      font-weight: 700;
    }

    /* BOTTOM STATUS BAR */

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      background: var(--tan);
      font-size: 0.67rem;
      color: var(--blue-dark);
      font-weight: 700;
    }

    /* MOBILE FIRST ADJUSTMENTS */

    @media (max-width: 540px) {
      .page {
        padding: 17px 13px;
        justify-content: flex-start;
      }

      .window {
        box-shadow: 4px 4px 0 var(--blue-dark);
      }

      .title-bar {
        min-height: 39px;
        padding: 6px 8px;
      }

      .title-bar-text {
        font-size: 0.76rem;
      }

      .window-control {
        width: 19px;
        height: 19px;
      }

      .pixel-strip {
        height: 7px;
        background-size: 10px 10px;
      }

      .window-content {
        padding: 19px 15px 22px;
      }

      .back-link {
        margin-bottom: 18px;
        font-size: 0.8rem;
      }

      h1 {
        font-size: clamp(2rem, 9vw, 2.55rem);
        letter-spacing: -1.8px;
      }

      .intro {
        font-size: 0.84rem;
        line-height: 1.5;
        margin-bottom: 19px;
      }

      .progress-container {
        padding: 10px;
        margin: 16px auto 25px;
      }

      .progress-heading {
        font-size: 0.65rem;
      }

      .progress-meter {
        gap: 5px;
      }

      .progress-box {
        max-width: none;
        aspect-ratio: 1.25 / 1;
        font-size: 14px;
      }

      .section-label {
        font-size: 0.88rem;
      }

      .paper-grid {
        gap: 10px;
        margin-bottom: 26px;
      }

      .paper-option {
        min-height: 0;
        aspect-ratio: 0.98 / 1;
        padding: 5px;
        font-size: 0.78rem;
      }

      .paper-option::before {
        border-width: 0 0 17px 17px;
      }

      .paper-option::after {
        border-width: 0 0 12px 12px;
      }

      .paper-option.selected::after {
        font-size: 1rem;
      }

      .continue-button {
        min-height: 52px;
        font-size: 0.88rem;
      }

      .status-bar {
        font-size: 0.57rem;
        padding: 9px 8px;
      }
    }

    /* EXTRA SMALL PHONES */

    @media (max-width: 360px) {
      .page {
        padding: 12px 10px;
      }

      .window-content {
        padding: 17px 12px 20px;
      }

      .paper-grid {
        gap: 8px;
      }

      .paper-option {
        font-size: 0.7rem;
      }

      .progress-heading {
        font-size: 0.59rem;
      }

      .status-bar {
        font-size: 0.52rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .paper-option,
      .continue-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="window">

      <!-- COMPUTER TITLE BAR -->
      <div class="title-bar">
        <span class="title-bar-text">
          ▣ FORTUNE_FACTORY.exe
        </span>

        <div class="window-controls" aria-label="Window controls">
          <span class="window-control" aria-hidden="true">_</span>
          <span class="window-control" aria-hidden="true">□</span>
          <span class="window-control close" aria-hidden="true">×</span>
        </div>
      </div>

      <!-- PIXEL DETAIL -->
      <div class="pixel-strip" aria-hidden="true"></div>

      <div class="window-content">

        <a class="back-link" href="fortune-from.html">
          ← Back
        </a>

        <h1>Fortune From</h1>

        <p class="intro">
          Welcome to the Fortune Factory! Create a fortune for someone to find. Remember: You’ll become part of someone’s day, so choose to brighten it!
        </p>

        <!-- PROGRESS METER -->
        <div class="progress-container">

          <div class="progress-heading">
            <span>CREATION PROGRESS</span>
            <span>02 / 06</span>
          </div>

          <div class="progress-meter"
               id="progressMeter"
               aria-label="Fortune creation progress">

            <div class="progress-box active">1</div>
            <div class="progress-box active">2</div>
            <div class="progress-box">3</div>
            <div class="progress-box">4</div>
            <div class="progress-box">5</div>
            <div class="progress-box">6</div>

          </div>
        </div>

        <label class="section-label">
          Choose a paper
        </label>

        <!-- PAPER SAMPLE GRID -->
        <div class="paper-grid"
             aria-label="Choose your paper colour">

          <button type="button"
                  class="paper-option ivory"
                  aria-pressed="false"
                  onclick="selectPaper('Ivory', this)">
            Ivory
          </button>

          <button type="button"
                  class="paper-option butter"
                  aria-pressed="false"
                  onclick="selectPaper('Butter', this)">
            Butter
          </button>

          <button type="button"
                  class="paper-option terracotta"
                  aria-pressed="false"
                  onclick="selectPaper('Terracotta', this)">
            Terracotta
          </button>

          <button type="button"
                  class="paper-option blush"
                  aria-pressed="false"
                  onclick="selectPaper('Blush', this)">
            Blush
          </button>

          <button type="button"
                  class="paper-option lavender"
                  aria-pressed="false"
                  onclick="selectPaper('Lavender', this)">
            Lavender
          </button>

          <button type="button"
                  class="paper-option powder"
                  aria-pressed="false"
                  onclick="selectPaper('Powder', this)">
            Powder
          </button>

          <button type="button"
                  class="paper-option sage"
                  aria-pressed="false"
                  onclick="selectPaper('Sage', this)">
            Sage
          </button>

          <button type="button"
                  class="paper-option smoke"
                  aria-pressed="false"
                  onclick="selectPaper('Smoke', this)">
            Smoke
          </button>

          <button type="button"
                  class="paper-option vintage"
                  aria-pressed="false"
                  onclick="selectPaper('Vintage', this)">
            Vintage
          </button>

        </div>

        <button
          class="continue-button"
          type="button"
          onclick="continuePaper()"
        >
          CONTINUE →
        </button>

        <p class="message"
           id="message"
           aria-live="polite"></p>

      </div>

      <!-- STATUS BAR -->
      <div class="status-bar">
        <span>● SYSTEM READY</span>
        <span>FORTUNE FACTORY v1.0</span>
      </div>

    </div>

  </main>

  <script>
    // PAPER SELECTION

    let selectedPaper = "";

    function selectPaper(paperName, selectedButton) {
      const paperOptions =
        document.querySelectorAll(".paper-option");

      paperOptions.forEach((option) => {
        option.classList.remove("selected");
        option.setAttribute("aria-pressed", "false");
      });

      selectedButton.classList.add("selected");
      selectedButton.setAttribute("aria-pressed", "true");

      selectedPaper = paperName;

      document.getElementById("message").textContent =
        paperName + " paper selected.";
    }

    // CONTINUE BUTTON

    function continuePaper() {
      const message = document.getElementById("message");

      if (!selectedPaper) {
        message.textContent = "Please choose a paper.";
        return;
      }

      sessionStorage.setItem("paperChoice", selectedPaper);

      window.location.href = "decorate-ink.html";
    }
  </script>
</body>
</html>
